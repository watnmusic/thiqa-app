      <form id="orderForm" class="space-y-3">

        <div class="grid grid-cols-2 gap-3">
          <input id="pickup" type="text" required placeholder="نقطة الاستلام"
            class="w-full bg-gray-950 border border-gray-800 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-red-500" />
          <input id="dropoff" type="text" required placeholder="وجهة التسليم"
            class="w-full bg-gray-950 border border-gray-800 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-red-500" />
        </div>
        <button type="submit"
          class="w-full bg-red-600 hover:bg-red-500 text-white font-semibold py-2.5 rounded-xl transition">
          إرسال الطلب
        </button>
      </form>
    </section>

    <section class="space-y-3">
      <h2 class="font-bold text-base text-gray-200">الطلبات الحالية</h2>
